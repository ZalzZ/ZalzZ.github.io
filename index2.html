    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #eee;
            --accent-color: #0f4c75;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .bg-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            animation: float 20s infinite ease-in-out;
        }

        .circle1 { width: 80px; height: 80px; left: 10%; top: 20%; animation-delay: 0s; animation-duration: 25s; }
        .circle2 { width: 120px; height: 120px; right: 15%; top: 60%; animation-delay: 5s; animation-duration: 30s; }
        .circle3 { width: 60px; height: 60px; left: 70%; bottom: 20%; animation-delay: 10s; animation-duration: 20s; }
        .circle4 { width: 150px; height: 150px; right: 30%; top: 10%; animation-delay: 15s; animation-duration: 35s; }
        .circle5 { width: 90px; height: 90px; left: 20%; bottom: 30%; animation-delay: 7s; animation-duration: 28s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
            25% { transform: translateY(-20px) rotate(90deg); opacity: 0.3; }
            50% { transform: translateY(10px) rotate(180deg); opacity: 0.6; }
            75% { transform: translateY(-15px) rotate(270deg); opacity: 0.4; }
        }

        .triangle {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0.1;
        }

        .triangle1 {
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid var(--accent-color);
            top: 15%;
            right: 10%;
            animation: rotate 30s infinite linear;
        }

        .triangle2 {
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 60px solid var(--secondary-color);
            bottom: 25%;
            left: 15%;
            animation: rotate 25s infinite linear reverse;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.4;
            animation: pulse 10s infinite ease-in-out;
        }

        .orb1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(15,76,117,0.8) 0%, transparent 70%);
            top: -150px;
            left: -150px;
        }

        .orb2 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(52,152,219,0.6) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            animation-delay: 5s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 0.6; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--secondary-color);
            border-radius: 50%;
            opacity: 0;
            animation: particle-float 15s infinite linear;
        }

        .particle1 { left: 10%; animation-delay: 0s; }
        .particle2 { left: 30%; animation-delay: 3s; }
        .particle3 { left: 50%; animation-delay: 6s; }
        .particle4 { left: 70%; animation-delay: 9s; }
        .particle5 { left: 90%; animation-delay: 12s; }

        @keyframes particle-float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        .container {
            max-width: 680px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease;
            position: relative;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-section {
            margin-bottom: 30px;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            position: relative;
            animation: float-logo 3s ease-in-out infinite;
        }

        @keyframes float-logo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--secondary-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 80px rgba(15,76,117,0.5);
            transition: all 0.3s ease;
            background: var(--secondary-color);
        }

        .logo-container:hover .logo-img {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 100px rgba(52,152,219,0.6);
            border-color: var(--accent-color);
        }

        h1 {
            color: var(--secondary-color);
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .tagline {
            color: rgba(238, 238, 238, 0.8);
            font-size: 16px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .footer-btn {
            text-decoration: none;
            color: white;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .social-btn:hover::before {
            width: 100px;
            height: 100px;
        }

        .social-btn:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 25px rgba(52, 152, 219, 0.4);
            border-color: var(--accent-color);
            background: rgba(15,76,117,0.3);
        }

        .social-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--secondary-color);
            position: relative;
            z-index: 1;
        }

        .links-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-item {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 18px 25px;
            text-decoration: none;
            color: var(--secondary-color);
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:hover {
            background: rgba(15,76,117,0.3);
            border-color: rgba(52,152,219,0.5);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.3);
            letter-spacing: 0.5px;
        }

        .link-icon2 {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-icon2 svg {
            width: 100%;
            height: 100%;
        }

        .link-item:hover .link-icon2 {
            transform: scale(1.2) rotate(10deg);
        }

        .link-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        footer {
            margin-top: 40px;
            color: rgba(238, 238, 238, 0.5);
            font-size: 14px;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 200px;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: rgba(238, 238, 238, 0.6);
            font-size: 14px;
        }

        @media (max-width: 640px) {
            h1 { font-size: 24px; }
            .logo-container { width: 100px; height: 100px; }
            .social-buttons { gap: 15px; }
            .social-btn { width: 45px; height: 45px; }
            .circle1, .circle2, .circle3, .circle4, .circle5 { opacity: 0.3; }
        }

        .link-item {
            animation: slideUp 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .link-item:nth-child(1) { animation-delay: 0.1s; }
        .link-item:nth-child(2) { animation-delay: 0.2s; }
        .link-item:nth-child(3) { animation-delay: 0.3s; }
        .link-item:nth-child(4) { animation-delay: 0.4s; }
        .link-item:nth-child(5) { animation-delay: 0.5s; }
        .link-item:nth-child(6) { animation-delay: 0.6s; }
        .link-item:nth-child(7) { animation-delay: 0.7s; }
    </style>
</head>

        // Track visitor on page load
        async function trackVisitor() {
            try {
                if (typeof updateDailyStats === 'function') {
                    await updateDailyStats();
                }
            } catch (error) {
                console.log('Visitor tracking skipped:', error.message);
            }
        }

        // Load links from Supabase or fallback to default
        async function loadLinks() {
            const container = document.getElementById('linksContainer');
            
            try {
                // Try to load from Supabase
                if (typeof getAllLinks === 'function') {
                    const result = await getAllLinks();
                    
                    if (result.success && result.data && result.data.length > 0) {
                        // Filter only active links
                        const activeLinks = result.data.filter(link => link.status);
                        renderLinks(activeLinks);
                    } else {
                        // Fallback to default links
                        renderLinks(defaultLinks);
                    }
                } else {
                    // Supabase not configured, use default links
                    renderLinks(defaultLinks);
                }
            } catch (error) {
                console.error('Error loading links:', error);
                // Fallback to default links on error
                renderLinks(defaultLinks);
            }
        }

        // Render links to DOM
        function renderLinks(links) {
            const container = document.getElementById('linksContainer');
            container.innerHTML = '';

            if (!links || links.length === 0) {
                container.innerHTML = '<p class="loading-text">No links available</p>';
                return;
            }

            links.forEach((link, index) => {
                const linkElement = document.createElement('a');
                linkElement.href = link.url;
                linkElement.className = 'link-item';
                linkElement.style.animationDelay = `${(index + 1) * 0.1}s`;
                linkElement.setAttribute('data-link-id', link.id);
                
                // Set target for external links
                if (link.url.startsWith('http') || link.url.startsWith('mailto:')) {
                    linkElement.target = '_blank';
                    linkElement.rel = 'noopener noreferrer';
                }

                // Get icon SVG
                const iconSvg = iconMap[link.icon] || iconMap.custom;

                linkElement.innerHTML = `
                    <span class="link-icon2">${iconSvg}</span>
                    <span>${link.name}</span>
                `;

                // Add click tracking
                linkElement.addEventListener('click', function(e) {
                    handleLinkClick(link.id);
                    addRippleEffect(e, this);
                });

                container.appendChild(linkElement);
            });
        }

        // Handle link click and track analytics
        async function handleLinkClick(linkId) {
            try {
                if (typeof trackLinkClick === 'function') {
                    await trackLinkClick(linkId);
                    console.log('Link click tracked:', linkId);
                }
            } catch (error) {
                console.log('Click tracking skipped:', error.message);
            }
        }

        // Add ripple effect on click
        function addRippleEffect(e, element) {
            const ripple = document.createElement('span');
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('ripple');
            
            // Add ripple styles dynamically if not exists
            if (!document.querySelector('#ripple-style')) {
                const style = document.createElement('style');
                style.id = 'ripple-style';
                style.textContent = `
                    .ripple {
                        position: absolute;
                        border-radius: 50%;
                        background: rgba(255, 255, 255, 0.6);
                        transform: scale(0);
                        animation: ripple-animation 0.6s ease-out;
                        pointer-events: none;
                    }
                    @keyframes ripple-animation {
                        to {
                            transform: scale(4);
                            opacity: 0;
                        }
                    }
                `;
                document.head.appendChild(style);
            }
            
            element.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        // Parallax effect for background ornaments
        document.addEventListener('mousemove', (e) => {
            const circles = document.querySelectorAll('.circle');
            const triangles = document.querySelectorAll('.triangle');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            circles.forEach((circle, index) => {
                const speed = (index + 1) * 2;
                circle.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
            
            triangles.forEach((triangle, index) => {
                const speed = (index + 1) * 3;
                triangle.style.transform = `translate(${-x * speed}px, ${-y * speed}px) rotate(${x * 360}deg)`;
            });
        });

        // Logo pulse effect on hover
        const logo = document.getElementById('logoImg');
        logo.addEventListener('mouseover', function() {
            this.style.animation = 'pulse 0.5s ease';
        });
        
        logo.addEventListener('animationend', function() {
            this.style.animation = '';
        });

        // Create more particles dynamically
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            document.querySelector('.bg-decoration').appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 20000);
        }

        // Generate particles periodically
        setInterval(createParticle, 3000);

        // Add typing effect to tagline
        const tagline = document.querySelector('.tagline');
        const text = tagline.textContent;
        tagline.textContent = '';
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                tagline.textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, 50);

        function updateGreeting() {
            const hour = new Date().getHours();
            const h1 = document.querySelector('h1');
            let greeting = 'Zalz Dashboard';

                greeting = '☀️ Good Morning';
            } else if (hour >= 12 && hour < 17) {
                greeting = '🌤️ Good Afternoon';
            } else if (hour >= 17 && hour < 21) {

            } else {

            }

            h1.textContent = greeting;
